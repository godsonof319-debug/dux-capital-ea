<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JARVIS — Voice Assistant</title>
<meta name="description" content="JARVIS — a powerful browser-based voice assistant." />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0A0612" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Jarvis" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="orb-bg" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="diamond">◆</span>
      <span class="brand-name" id="brandName">JARVIS</span>
    </div>
    <div class="status" id="statusChips">
      <button class="chip toggle" id="wakeChip" title="Hands-free 'Hey Jarvis' listening">wake: off</button>
      <span class="chip" id="chipAI">AI: …</span>
      <span class="chip" id="chipVoice">voice: …</span>
      <button class="chip toggle" id="installChip" title="Install as an app" hidden>⤓ install</button>
    </div>
  </header>

  <main class="stage">
    <!-- Animated voice orb -->
    <section class="orb-wrap">
      <button id="orb" class="orb" aria-label="Tap to talk">
        <div class="orb-core"></div>
        <div class="orb-ring ring1"></div>
        <div class="orb-ring ring2"></div>
        <div class="orb-ring ring3"></div>
        <div class="orb-mic">🎤</div>
      </button>
      <p class="orb-hint" id="orbHint">Tap the orb and speak</p>
    </section>

    <!-- Transcript -->
    <section class="chat" id="chat" aria-live="polite"></section>
  </main>

  <!-- Suggestion chips -->
  <div class="suggestions" id="suggestions"></div>

  <!-- Composer -->
  <form class="composer" id="composer" autocomplete="off">
    <button type="button" class="icon-btn" id="micBtn" title="Speak" aria-label="Speak">🎤</button>
    <input id="input" type="text" placeholder="Ask me anything, or type a command…" autocomplete="off" />
    <button type="button" class="icon-btn ghost" id="muteBtn" title="Toggle voice output" aria-label="Toggle voice output">🔊</button>
    <button type="submit" class="send-btn" id="sendBtn">Send</button>
  </form>

  <footer class="foot">
    <span id="footNote">Built for the browser · Web Speech API</span>
    <button id="clearBtn" class="link-btn">Clear chat</button>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
